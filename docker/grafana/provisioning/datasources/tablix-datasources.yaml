apiVersion: 1

# Stable UIDs (prometheus, tempo, loki) so dashboard JSON can reference datasources portably.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://tablix-prometheus:9090
    isDefault: true

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tablix-tempo:3200
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        tags:
          - key: 'service.name'
            value: 'service_name'

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://tablix-loki:3100
    jsonData:
      derivedFields:
        # Radiant ships trace_id as OTLP structured metadata; link each log line to its trace in Tempo.
        - name: 'TraceID'
          matcherType: 'label'
          matcherRegex: 'trace_id'
          url: '$${__value.raw}'
          datasourceUid: tempo
